<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Flirta · Find Your Dream Garba Partner</title>
  <meta name="description" content="Find your dream Garba partner for Navratri 2026. Discover compatible dance partners, make friends, and explore connections on Flirta.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!-- Header / Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/garba-partner" class="brand-logo" onclick="event.preventDefault(); Router.navigate('/garba-partner');">
        <div class="brand-icon" style="font-weight: 800; font-size: 1rem; color: #FFF; background: var(--color-primary); width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center;">F</div>
        <span>Flirta</span>
      </a>
      <nav>
        <ul class="nav-links" id="navbar-links">
          <!-- Populated dynamically by app.js based on auth state -->
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="main-content" role="main">
    <!-- Populated dynamically by Router -->
  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-nav" id="mobile-bottom-nav">
    <!-- Populated dynamically by app.js based on auth state -->
  </nav>

  <!-- Auth Modal (Login / 18+ Register) -->
  <div id="auth-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <div style="display: flex; gap: 8px;">
          <button id="tab-login-btn" class="btn btn-sm btn-secondary active" onclick="switchAuthTab('login')">Sign In</button>
          <button id="tab-reg-btn" class="btn btn-sm btn-secondary" onclick="switchAuthTab('register')">Join 18+</button>
        </div>
        <button class="close-btn" onclick="closeAuthModal()" aria-label="Close modal">×</button>
      </div>

      <!-- Login Form Container -->
      <div id="login-form-container">
        <h3 id="auth-modal-title" style="font-size: 1.3rem; margin-bottom: 8px;">Welcome to Flirta</h3>
        <p style="color: var(--color-text-secondary); font-size: 0.88rem; margin-bottom: 20px;">
          Log into your verified dancer account for Navratri 2026.
        </p>

        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
              <button type="button" class="btn-text" style="font-size: 0.78rem; color: var(--color-primary); background: none; border: none; cursor: pointer; padding: 0;" onclick="handleForgotPassword()">Forgot?</button>
            </div>
            <div style="position: relative;">
              <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 42px;">
              <button type="button" onclick="togglePasswordVisibility('login-password', this)" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; padding: 4px; color: var(--color-text-muted);" aria-label="Toggle password visibility">
                <svg style="pointer-events: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 0.84rem;">
            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--color-text-secondary); user-select: none;">
              <input type="checkbox" id="login-remember" checked accent-color="var(--color-primary)">
              <span>Remember me</span>
            </label>
          </div>

          <div id="login-error" style="color: var(--color-danger); font-size: 0.85rem; margin-bottom: 14px;"></div>

          <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>

        <!-- 1-Click Demo Logins for Testing -->
        <div style="margin-top: 16px; padding: 12px 14px; background: var(--color-bg); border: 1px dashed var(--color-border); border-radius: var(--radius-sm);">
          <div style="font-size: 0.75rem; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">
            1-Click Demo Accounts (Instant Test Login):
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <button type="button" class="btn btn-primary btn-sm" style="font-size: 0.76rem; padding: 4px 10px;" onclick="quickFillLogin('test@flirta.in', 'TestPassword123')">★ Test Account (All Unlocked)</button>
            <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.76rem; padding: 4px 10px;" onclick="quickFillLogin('diya.shah@example.com', 'Dancer2026!')">Diya (Ahmedabad)</button>
            <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.76rem; padding: 4px 10px;" onclick="quickFillLogin('rohan.patel@example.com', 'Dancer2026!')">Rohan (Surat)</button>
            <button type="button" class="btn btn-secondary btn-sm" style="font-size: 0.76rem; padding: 4px 10px;" onclick="quickFillLogin('admin@garbajodi.com', 'AdminGarba2026!')">Admin</button>
          </div>
        </div>

        <div style="margin: 20px 0; text-align: center; position: relative;">
          <div style="height: 1px; background: rgba(0,0,0,0.08); width: 100%;"></div>
          <span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: #FFFFFF; padding: 0 10px; font-size: 0.78rem; font-weight: 700; color: var(--color-text-muted);">OR</span>
        </div>

        <button type="button" class="btn btn-secondary btn-block btn-sm" onclick="handleGoogleSignInNotice()">
          Continue with Google
        </button>
      </div>

      <!-- Register Form Container -->
      <div id="register-form-container" style="display: none;">
        <h3 style="font-size: 1.3rem; margin-bottom: 6px;">Create Dancers Account</h3>
        <p style="color: var(--color-text-secondary); font-size: 0.85rem; margin-bottom: 18px;">
          Adult Only (18+ verified platform)
        </p>

        <form onsubmit="handleRegister(event)">
          <div class="form-group">
            <label class="form-label" for="reg-name">Display Name</label>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Diya Sharma" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password (min 6 characters)</label>
            <div style="position: relative;">
              <input type="password" id="reg-password" class="form-control" placeholder="Create secure password" required minlength="6" autocomplete="new-password" style="padding-right: 42px;">
              <button type="button" onclick="togglePasswordVisibility('reg-password', this)" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; padding: 4px; color: var(--color-text-muted);" aria-label="Toggle password visibility">
                <svg style="pointer-events: none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div class="form-group">
              <label class="form-label" for="reg-dob">Date of Birth</label>
              <input type="date" id="reg-dob" class="form-control" required max="2008-10-09">
            </div>

            <div class="form-group">
              <label class="form-label" for="reg-city">City</label>
              <select id="reg-city" class="form-control">
                <option value="Ahmedabad">Ahmedabad (Gujarat)</option>
                <option value="Surat">Surat (Gujarat)</option>
                <option value="Vadodara">Vadodara (Gujarat)</option>
                <option value="Rajkot">Rajkot (Gujarat)</option>
                <option value="Gandhinagar">Gandhinagar (Gujarat)</option>
                <option value="Bhavnagar">Bhavnagar (Gujarat)</option>
                <option value="Jamnagar">Jamnagar (Gujarat)</option>
                <option value="Junagadh">Junagadh (Gujarat)</option>
                <option value="Anand">Anand (Gujarat)</option>
                <option value="Navsari">Navsari (Gujarat)</option>
                <option value="Morbi">Morbi (Gujarat)</option>
                <option value="Bharuch">Bharuch (Gujarat)</option>
                <option value="Mehsana">Mehsana (Gujarat)</option>
                <option value="Bhuj">Bhuj (Gujarat)</option>
                <option value="Porbandar">Porbandar (Gujarat)</option>
                <option value="Valsad">Valsad (Gujarat)</option>
                <option value="Vapi">Vapi (Gujarat)</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Indore">Indore</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-experience">Garba Experience Level</label>
            <select id="reg-experience" class="form-control">
              <option value="intermediate">Intermediate (Grooving easily)</option>
              <option value="beginner">Beginner (Learning Steps)</option>
              <option value="advanced">Advanced (Raas Enthusiast)</option>
            </select>
          </div>

          <div class="form-group" style="padding: 12px; background: rgba(0,0,0,0.02); border: 1px solid var(--color-border); border-radius: 8px; display: flex; flex-direction: column; gap: 8px;">
            <label class="form-checkbox" style="font-size: 0.82rem; line-height: 1.4;">
              <input type="checkbox" id="reg-adult-confirm" required>
              <span>I declare under penalty of law that I am <strong>18 years of age or older</strong> (Strict 18+ adult platform - underage accounts violate POCSO Act).</span>
            </label>
            <label class="form-checkbox" style="font-size: 0.82rem; line-height: 1.4;">
              <input type="checkbox" id="reg-terms-confirm" required>
              <span>I accept the <a href="javascript:void(0)" onclick="Legal.open('terms')" style="color: var(--color-primary); font-weight: 700; text-decoration: underline;">Terms of Service</a>, <a href="javascript:void(0)" onclick="Legal.open('privacy')" style="color: var(--color-primary); font-weight: 700; text-decoration: underline;">Privacy Policy</a>, <a href="javascript:void(0)" onclick="Legal.open('anti-escort')" style="color: var(--color-primary); font-weight: 700; text-decoration: underline;">Anti-Escort Policy</a>, and understand offline meetings are at my own risk.</span>
            </label>
          </div>

          <div id="reg-error" style="color: var(--color-danger); font-size: 0.85rem; margin-bottom: 14px;"></div>

          <button type="submit" class="btn btn-primary btn-block">Complete Registration</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Safety & Report Modal -->
  <div id="report-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="report-modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="report-modal-title">Report Content or Profile</h3>
        <button class="close-btn" onclick="closeReportModal()" aria-label="Close modal">×</button>
      </div>
      <p id="report-target-name" style="font-size: 0.88rem; color: var(--color-gold-light); margin-bottom: 16px;"></p>

      <form onsubmit="handleReportSubmit(event)">
        <input type="hidden" id="report-target-type">
        <input type="hidden" id="report-target-id">

        <div class="form-group">
          <label class="form-label" for="report-reason">Reason</label>
          <select id="report-reason" class="form-control" required>
            <option value="">Select a reason...</option>
            <option value="Inappropriate behavior or language">Inappropriate behavior or language</option>
            <option value="Fake or misleading profile">Fake or misleading profile</option>
            <option value="Suspected underage account">Suspected underage account</option>
            <option value="Commercial spam or unauthorized promotion">Commercial spam or unauthorized promotion</option>
            <option value="Commercial solicitation / escort services">Commercial solicitation / escort services</option>
            <option value="Harassment or safety concern">Harassment or safety concern</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="report-details">Additional Details (Optional)</label>
          <textarea id="report-details" class="form-control" rows="3" placeholder="Provide any context that will help our safety administrators investigate..."></textarea>
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="closeReportModal()">Cancel</button>
          <button type="submit" class="btn btn-danger btn-sm">Submit Safety Report</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/metaAds.js"></script>
  <script src="/js/state.js"></script>
  <script src="/js/components/SafetyModals.js"></script>
  <script src="/js/components/Legal.js"></script>
  <script src="/js/components/Landing.js"></script>
  <script src="/js/components/AuthModal.js"></script>
  <script src="/js/components/Discover.js"></script>
  <script src="/js/components/LikesReceived.js"></script>
  <script src="/js/components/Pricing.js"></script>
  <script src="/js/components/Matches.js"></script>
  <script src="/js/components/Events.js"></script>
  <script src="/js/components/Groups.js"></script>
  <script src="/js/components/Profile.js"></script>
  <script src="/js/components/Admin.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
